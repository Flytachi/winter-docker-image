name: publish

# Builds every line of versions.json, checks it with ./test.sh, and pushes it to Docker
# Hub for linux/amd64 and linux/arm64.
#
# Tags of { "php": "8.5", "swoole": "6.2.6" }, built on 2026-10-29 (build.sh decides them):
#   8.5-swoole6.2.6         every line: its exact versions
#   8.5-swoole6.2           the newest 6.2.x listed for PHP 8.5 — moves when a newer one is
#   8.5-swoole6.2-20261029  ...its dated copy, never moves: pin this in production
#   8.5                     only with "major": true — one line per PHP version
#   latest                  only with "latest": true — one line in the file
#
# A line with "rc": true is a build being tried: only 8.5-swoole6.2.6-rc and 8.5-rc.
#
# Runs on a push to main, every Monday (so the base image's security fixes reach the
# published one), and by hand: Actions → publish → Run workflow.
# A pull request into main builds and checks every line the same way, and publishes nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.read.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      # Two lines claiming one tag would both push it, and the last build to finish
      # would win. The rules live in build.sh — the same check runs locally.
      - name: Check versions.json
        run: |
          # build.sh reads the file line by line, the matrix below reads it as JSON:
          # one build per line keeps them agreeing.
          if [ "$(jq length versions.json)" -ne "$(grep -c '"php"' versions.json)" ]; then
            echo "::error::versions.json: write each build on a line of its own"
            exit 1
          fi
          sh build.sh --check
      - id: read
        run: echo "builds=$(jq -c . versions.json)" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: php ${{ matrix.php }} · swoole ${{ matrix.swoole }}${{ matrix.rc && ' · rc' || '' }}
    env:
      PHP_VERSION: ${{ matrix.php }}
      SWOOLE_VERSION: ${{ matrix.swoole }}
      MAJOR: ${{ matrix.major && 'yes' || 'no' }}
      LATEST: ${{ matrix.latest && 'yes' || 'no' }}
      RC: ${{ matrix.rc && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # build.sh decides the tags — the same ones it gives a local build. The first is
      # the one ./test.sh looks for.
      - name: Tags
        id: tags
        run: |
          list="$(sh build.sh --tags "$PHP_VERSION" "$SWOOLE_VERSION")"
          echo "$list"
          {
            echo "check=$(echo "$list" | head -1)"
            echo "list<<EOF"
            echo "$list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for the check (this runner's architecture)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            SWOOLE_VERSION=${{ env.SWOOLE_VERSION }}
          load: true
          tags: ${{ steps.tags.outputs.check }}

      - name: Check
        run: sh test.sh "$PHP_VERSION" "$SWOOLE_VERSION"

      # A pull request stops here: built and checked, nothing pushed. (A pull request
      # from a fork has no secrets anyway.)
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            SWOOLE_VERSION=${{ env.SWOOLE_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
