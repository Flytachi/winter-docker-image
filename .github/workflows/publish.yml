name: publish

# Builds every line of versions.json, checks it with ./test.sh, and pushes it to Docker
# Hub for linux/amd64 and linux/arm64.
#
# Tags of a line { "php": "8.5", "swoole": "6.2.3" }, built on 2026-10-29:
#   8.5-swoole6.2           moves within the Swoole 6.2 line
#   8.5-swoole6.2-20261029  never moves: pin this in production
#   8.5                     only with "major": true — one line per PHP version
#   latest                  only with "latest": true — one line in the file
#
# Runs on a push to main, every Monday (so the base image's security fixes reach the
# published one), and by hand: Actions → publish → Run workflow.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.read.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      # Two lines claiming one tag would both push it, and the last build to finish
      # would win. build.sh refuses the same file.
      - name: Check versions.json
        run: |
          dup="$(jq -r '[.[] | select(.major)] | group_by(.php)[] | select(length > 1) | .[0].php' versions.json)"
          if [ -n "$dup" ]; then
            echo "::error::versions.json: more than one \"major\": true for PHP $dup"
            exit 1
          fi
          if [ "$(jq '[.[] | select(.latest)] | length' versions.json)" -gt 1 ]; then
            echo "::error::versions.json: more than one \"latest\": true"
            exit 1
          fi
      - id: read
        run: echo "builds=$(jq -c . versions.json)" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: php ${{ matrix.php }} · swoole ${{ matrix.swoole }}
    env:
      PHP_VERSION: ${{ matrix.php }}
      SWOOLE_VERSION: ${{ matrix.swoole }}
      MAJOR: ${{ matrix.major && 'yes' || 'no' }}
      LATEST: ${{ matrix.latest && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: tags
        run: |
          MINOR="$(echo "$SWOOLE_VERSION" | cut -d. -f1,2)"
          IMAGE=flytachi/winter
          {
            echo "check=$IMAGE:$PHP_VERSION-swoole$MINOR"
            echo "list<<EOF"
            echo "$IMAGE:$PHP_VERSION-swoole$MINOR"
            echo "$IMAGE:$PHP_VERSION-swoole$MINOR-$(date -u +%Y%m%d)"
            [ "$MAJOR" = yes ] && echo "$IMAGE:$PHP_VERSION"
            [ "$LATEST" = yes ] && echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for the check (this runner's architecture)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            SWOOLE_VERSION=${{ env.SWOOLE_VERSION }}
          load: true
          tags: ${{ steps.tags.outputs.check }}

      - name: Check
        run: sh test.sh "$PHP_VERSION" "$SWOOLE_VERSION"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            SWOOLE_VERSION=${{ env.SWOOLE_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
